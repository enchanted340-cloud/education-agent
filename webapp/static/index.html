<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>知序 · 学习空间</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <aside class="rail" id="sidebar">
      <a class="brand" href="#home"
        ><span class="brand-mark">知</span
        ><span>知序<small>ZHIXU · LEARNING</small></span></a
      >
      <div class="course-switch">
        <span class="course-icon">⌘</span>
        <div>
          <strong>Java 程序设计</strong><small>基于已有作答的学习空间</small>
        </div>
      </div>
      <p class="rail-label" id="nav-label">学习与探索</p>
      <nav id="navigation" aria-label="主导航"></nav>
      <div class="rail-bottom">
        <div class="gentle-note">
          从每一份证据出发<small>理解表现，再安排下一步。</small>
        </div>
        <div class="mode-switch" role="group" aria-label="界面模式">
          <button id="learner-mode" type="button">学习空间</button
          ><button id="admin-mode" type="button">管理后台</button>
        </div>
        <p class="local-caption">
          <span class="dot"></span> 本地连接 · 免登录工作空间
        </p>
      </div>
    </aside>
    <main>
      <header>
        <div class="header-left">
          <button
            type="button"
            id="menu-toggle"
            aria-label="展开导航"
            aria-expanded="false"
          >
            ☰</button
          ><span id="breadcrumb">我的空间 / 学习空间</span>
        </div>
        <div class="header-actions">
          <label for="student">当前学生</label
          ><select id="student" aria-label="当前学生"></select
          ><button id="refresh" class="quiet" type="button">刷新数据 ↻</button>
        </div>
      </header>
      <div class="context-bar">
        <span><i class="dot"></i> 已连接本地保存结果</span>
        <div>
          <label for="profile-select">参考画像</label
          ><select id="profile-select" aria-label="参考画像"></select>
        </div>
      </div>
      <div id="notice" role="status" hidden></div>
      <div id="content" aria-live="polite">
        <p class="empty">正在读取学生与学习记录…</p>
      </div>
      <footer>
        知序 · Java 学习原型<span>本地工作空间</span>
      </footer>
    </main>
    <dialog id="detail">
      <div class="dialog-top">
        <h2 id="detail-title">查看详情</h2>
        <button id="close-detail" class="quiet" type="button">关闭 ×</button>
      </div>
      <div id="detail-body"></div>
    </dialog>
    <script type="module" src="/app.js"></script>
  </body>
</html>
